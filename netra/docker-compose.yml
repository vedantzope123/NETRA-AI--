version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netra_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-netra-super-secret-production-key-change-in-prod-2026}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./netra.db}
    volumes:
      - ./backend/netra.db:/app/netra.db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netra_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
